kind: 'Fixed'
body: 'fixed the `code-check > quality:proguard` job, which failed on every run against `main`. ProGuard listed five dead members; exactly one of them was really dead -- the `Colorize.setColor(String, Params)` overload, which no caller anywhere reached -- and it has been deleted. The other four are artefacts of ProGuard reading BYTECODE rather than source: `SecurityAgent.SERVICE_NAME`, `SecurityAgent.CONNECTION_TIMEOUT` and `Commands.SUDO_PASSWD` are compile-time constants that javac folds into each use site, so the fields are never read with `getstatic` even though the source uses them throughout, and `Report.serialVersionUID` is read reflectively by Java serialization, which no call graph can see. A new `.proguard-keep.pro` exempts those four by exact name, so any newly unused member is still reported.'
time: '2026-08-26T17:30:00.000000000Z'
